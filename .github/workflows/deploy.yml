name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run typecheck:api && npm run typecheck:web
      - run: node node_modules/tsx/dist/cli.mjs --test tests/client-recovery.test.ts tests/client-errors.test.ts tests/client-error-store.test.ts tests/voucher-audience.test.ts tests/returning-voucher.test.ts tests/voucher-wallet.test.ts tests/voucher-price.test.ts tests/promotions-evaluator.test.ts tests/checkout-voucher-consistency.test.ts tests/share-caption.test.ts tests/product-share-data.test.ts tests/share-capabilities.test.ts
      - run: python3 tests/release-nginx.test.py && python3 tests/release-rollback.test.py
      - run: bash -n scripts/deploy-production.sh
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 25m
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:$PATH"
            if [ -s "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh"; fi
            cd /root/aloha-shop
            git fetch origin
            deploy_ref="${{ github.sha }}"
            runner=$(mktemp -d /tmp/aloha-deploy.XXXXXX)
            for file in deploy-production.sh release-processes.cjs release-nginx.py; do
              git show "$deploy_ref:scripts/$file" > "$runner/$file"
            done
            DEPLOY_REF="$deploy_ref" bash "$runner/deploy-production.sh"

  browser-smoke:
    name: Verify browsers after deployment
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tests/browser-qa --no-audit --no-fund
      - run: node tests/browser-qa/node_modules/playwright/cli.js install --with-deps chromium webkit
      - run: npm test --prefix tests/browser-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-results
          path: |
            tests/browser-qa/playwright-report/
            tests/browser-qa/test-results/
          retention-days: 7
