name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Validate release (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        check: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - if: matrix.check == 'web'
        run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run typecheck:${{ matrix.check }}
      - if: matrix.check == 'api'
        run: node --test tests/fast-checks.test.cjs
      - if: matrix.check == 'api'
        run: npm run test:release
      - if: matrix.check == 'api'
        run: python3 tests/release-nginx.test.py && python3 tests/release-rollback.test.py
      - if: matrix.check == 'api'
        run: bash -n scripts/deploy-production.sh && bash -n scripts/prune-releases.sh
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 25m
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:$PATH"
            if [ -s "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh"; fi
            cd /root/aloha-shop
            git fetch origin
            deploy_ref="${{ github.sha }}"
            runner=$(mktemp -d /tmp/aloha-deploy.XXXXXX)
            for file in deploy-production.sh release-processes.cjs release-nginx.py prune-releases.sh; do
              git show "$deploy_ref:scripts/$file" > "$runner/$file"
            done
            DEPLOY_REF="$deploy_ref" bash "$runner/deploy-production.sh"

  browser-smoke:
    name: Quick browser checks (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
            install-options: --only-shell
          - project: webkit-mobile
            browser: webkit
            install-options: ''
    env:
      QA_REPORT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser-qa/package-lock.json
      - run: npm ci --prefix tests/browser-qa --no-audit --no-fund
      - run: node tests/browser-qa/node_modules/playwright/cli.js install --with-deps ${{ matrix.install-options }} ${{ matrix.browser }}
      - run: npm run test:smoke --prefix tests/browser-qa -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-${{ matrix.project }}
          path: |
            tests/browser-qa/playwright-report/
            tests/browser-qa/test-results/
          retention-days: 3
